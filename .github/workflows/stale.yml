name: Stale Issue Management

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stale issue management
        uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days.
            If you are still experiencing a problem, please leave a comment to keep it open.
            Otherwise, this issue will be closed in 14 days.
          close-issue-message: >
            This issue has been closed due to inactivity for 74 days.
            If you are still experiencing a problem, please open a new issue.
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
          exempt-issue-labels: 'enhancement,help wanted'
          stale-pr-message: >
            This pull request has been inactive for 60 days.
            If you are still working on it, please leave a comment to keep it open.
            Otherwise, this PR will be closed in 14 days.
          close-pr-message: >
            This pull request has been closed due to inactivity for 74 days.
          enable-issue-autolabeler: false
