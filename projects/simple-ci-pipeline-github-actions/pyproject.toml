[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-ci-app"
version = "0.1.0"
description = "Tiny demo app for the Simple CI pipeline with GitHub Actions project"
requires-python = ">=3.9"

[project.scripts]
simple-ci-app = "simple_ci_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
