apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  # This selector's `version` value is exactly what "cutover" and
  # "rollback" mean in this project — patching it is the entire
  # deployment strategy. No pods are ever restarted to switch traffic.
  selector:
    app: demo-app
    version: blue
  ports:
    - port: 80
      targetPort: 8080
